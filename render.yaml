services:
  - type: web
    name: Fiscalia
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: fiscalia-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/storage/data
      - key: CORS_ORIGIN
        value: https://estadisticafiscalia.netlify.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
